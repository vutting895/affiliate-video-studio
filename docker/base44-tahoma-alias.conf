<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Maps the "Tahoma" family requested by app.py onto a Thai-capable face
     installed in the Base44 image, so Thai headlines render instead of
     failing with "unable to read font `Tahoma'". -->
<fontconfig>
  <alias binding="same">
    <family>Tahoma</family>
    <prefer>
      <family>Norasi</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Tahoma</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Norasi</string>
    </edit>
  </match>
</fontconfig>
